include: package:very_good_analysis/analysis_options.10.3.0.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: info
  exclude:
    - "build/**"
    - "android/**"
    - "ios/**"
    # Gitignored, populated locally by the developer with real credentials;
    # CI stubs it from the `.example.dart` template before the example builds.
    - "lib/local_config.dart"
    # Flutter's AnalysisOptionsMigration (flutter_tools) appends any of
    # build/android/ios/web/windows/macos/linux that `analyzer.exclude` does not
    # already reach, on every `flutter pub get`. That left the tree dirty in CI
    # and failed `pub publish --dry-run` on "checked-in files are modified in
    # git". There is no opt-out, so the migrated state is committed here.
    - web/**
    - windows/**
    - macos/**
    - linux/**
