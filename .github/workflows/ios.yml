name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    env:
      # Secrets are not readable in step `if:` conditions, so surface their
      # presence through the env context. While the signing secrets are not
      # configured, the job degrades to an unsigned simulator build instead of
      # failing every PR on missing repository configuration.
      IOS_SIGNING_CONFIGURED: >-
        ${{ secrets.IOS_CERTIFICATE_BASE64 != ''
         && secrets.IOS_CERTIFICATE_PASSWORD != ''
         && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin to the latest stable Xcode so the toolchain matches what the
      # maintainer tests against, rather than the default that ships on the
      # macos-latest image (which can lag behind Flutter's iOS expectations).
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          flutter --version

      # `example/lib/local_config.dart` is gitignored (it holds developer
      # credentials). Use the committed `.example.dart` template as a stub so
      # the example compiles in CI without exposing real secrets.
      - name: Stub local_config.dart
        run: cp lib/local_config.example.dart lib/local_config.dart
        working-directory: example

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build unsigned iOS app for simulator (signing secrets absent)
        if: env.IOS_SIGNING_CONFIGURED != 'true'
        run: |
          echo "::notice::iOS signing secrets are not configured; building for the simulator without codesigning. Configure IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64 to get a signed release IPA from this job."
          flutter build ios --debug --simulator --no-codesign
        working-directory: example

      - name: Install iOS signing certificate and provisioning profile
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Fall back to the p12 password when no dedicated keychain password is
          # configured, so the job stays runnable with the three core secrets.
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-${IOS_CERTIFICATE_PASSWORD}}"

          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          # The decoded p12 is signing material; drop it as soon as it is in
          # the keychain rather than leaving it on the runner's disk.
          trap 'rm -f "${CERTIFICATE_PATH}"' EXIT

          printf '%s' "${IOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          # The `codesign:` partition is added explicitly so codesign can use the
          # imported private key non-interactively, matching vrtx-sdk-ios.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          # `list-keychains` is plural — the singular form does not exist and
          # silently left the temp keychain out of the search list before.
          # Existing keychains are appended, not replaced, so the login keychain
          # stays reachable. Word-splitting is intentional: each path must be a
          # separate argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$(security cms -D -i "${PROFILE_PATH}")"
          PROFILE_UUID="$(printf '%s' "${PROFILE_PLIST}" | plutil -extract UUID raw -)"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          # Derive the team and profile name from the profile itself rather than
          # carrying a separate IOS_TEAM_ID secret that can drift out of sync
          # with the profile actually installed.
          PROFILE_NAME="$(printf '%s' "${PROFILE_PLIST}" | plutil -extract Name raw -)"
          TEAM_ID="$(printf '%s' "${PROFILE_PLIST}" | plutil -extract TeamIdentifier.0 raw -)"
          # Export method must match the profile type, or -exportArchive fails
          # with a confusing mismatch error: profiles that provision specific
          # devices are ad-hoc/development, and those that don't are App Store.
          if printf '%s' "${PROFILE_PLIST}" | plutil -extract ProvisionedDevices raw - >/dev/null 2>&1; then
            EXPORT_METHOD="release-testing"   # ad-hoc
          else
            EXPORT_METHOD="app-store-connect"
          fi

          {
            echo "TEAM_ID=${TEAM_ID}"
            echo "PROFILE_NAME=${PROFILE_NAME}"
            echo "EXPORT_METHOD=${EXPORT_METHOD}"
          } >> "${GITHUB_ENV}"

      - name: Configure Release signing for the example app
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          # Flutter drives xcodebuild itself, so signing settings can't be passed
          # on the command line — `flutter build ipa` forwards no build settings,
          # and setting them globally would also apply to every Pods target
          # (including VRTX.framework, which cannot take a provisioning profile).
          # Release.xcconfig is the supported seam Flutter already reads.
          cat >> ios/Flutter/Release.xcconfig <<EOF

          // Injected by CI for the signed release build.
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          CODE_SIGN_IDENTITY = Apple Distribution
          EOF
        working-directory: example

      - name: Build signed iOS release IPA
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>sa.vrtx.vrtxFlutterExample</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist="${RUNNER_TEMP}/ExportOptions.plist"
        working-directory: example

      # The point of this job is a device-installable build for FreeRASP checks,
      # which needs the IPA to actually leave the runner.
      - name: Upload signed IPA artifact
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vrtx-flutter-example-signed-ipa
          path: example/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
