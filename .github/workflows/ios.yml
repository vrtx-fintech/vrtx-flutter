name: iOS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-example-ios:
    name: build-example-ios
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin to the latest stable Xcode so the toolchain matches what the
      # maintainer tests against, rather than the default that ships on the
      # macos-latest image (which can lag behind Flutter's iOS expectations).
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          flutter --version

      # `example/lib/local_config.dart` is gitignored (it holds developer
      # credentials). Use the committed `.example.dart` template as a stub so
      # the example compiles in CI without exposing real secrets.
      - name: Stub local_config.dart
        run: cp lib/local_config.example.dart lib/local_config.dart
        working-directory: example

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Install iOS signing certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64" || { echo "::error::IOS_CERTIFICATE_BASE64 is not configured"; exit 1; }
          test -n "$IOS_CERTIFICATE_PASSWORD" || { echo "::error::IOS_CERTIFICATE_PASSWORD is not configured"; exit 1; }
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not configured"; exit 1; }
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Build signed iOS release IPA
        run: flutter build ipa --release
        working-directory: example
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
