# Cuts a release automatically whenever a pubspec.yaml version bump lands on
# main, so every published SDK version gets a tag and a GitHub release without
# anyone remembering to push one (0.0.2 through 0.1.3 shipped to pub.dev with
# no tag and no release page).
#
#   1. Validates the release metadata: ios/vrtx_flutter.podspec must carry the
#      same version, and CHANGELOG.md must have a section for it.
#   2. Pushes tag v<version> and creates the GitHub release from that
#      CHANGELOG section.
#   3. The tag push triggers release.yml, which publishes to pub.dev behind
#      the approval-gated `production` environment.
#
# Step 3 only fires when the tag is pushed with the release-bot GitHub App
# token: pub.dev accepts OIDC publishes solely from tag-push-triggered runs,
# and tags pushed with the default GITHUB_TOKEN never trigger workflows
# (GitHub's recursion guard). Without the app secrets this workflow still
# creates the tag and the GitHub release, and prints how to finish the chain.
#
# Setup for full automation (org admin, one time):
#   - Install the release-bot GitHub App on vrtx-flutter.
#   - Grant the org secrets RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY to
#     this repository (they already serve vrtx-sdk-ios's release workflow).
name: Auto release

on:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml

permissions:
  contents: read

concurrency:
  group: auto-release-vrtx-flutter
  cancel-in-progress: false

jobs:
  tag-and-release:
    name: Tag & GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets are not readable in step `if:` conditions, so surface their
      # presence through the env context.
      RELEASE_BOT_CONFIGURED: >-
        ${{ secrets.RELEASE_BOT_APP_ID != ''
         && secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and validate release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          test -n "${VERSION}" || { echo "::error::pubspec.yaml has no version."; exit 1; }

          POD_VERSION="$(grep -E "s\.version" ios/vrtx_flutter.podspec | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)"
          if [ "${POD_VERSION}" != "${VERSION}" ]; then
            echo "::error::ios/vrtx_flutter.podspec is at ${POD_VERSION} but pubspec.yaml is at ${VERSION}. Bump them together."
            exit 1
          fi

          if git ls-remote --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; nothing to release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # This version's CHANGELOG section becomes the release notes.
          awk -v ver="${VERSION}" \
            '$0 == "## " ver {flag=1; next} /^## /{flag=0} flag' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q "[^[:space:]]" "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}. Add one before releasing."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Mint release-bot token
        id: app-token
        if: steps.meta.outputs.skip == 'false' && env.RELEASE_BOT_CONFIGURED == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vrtx-flutter

      # Pushed with the app token so the tag push triggers release.yml, which
      # is what actually publishes to pub.dev.
      - name: Push release tag (release bot)
        if: steps.meta.outputs.skip == 'false' && env.RELEASE_BOT_CONFIGURED == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}" "v${VERSION}"

      - name: Push release tag (default token — pub.dev publish stays manual)
        if: steps.meta.outputs.skip == 'false' && env.RELEASE_BOT_CONFIGURED != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          echo "::warning::RELEASE_BOT_APP_ID / RELEASE_BOT_PRIVATE_KEY are not available to this repository, so this tag push cannot trigger the pub.dev publish workflow. Grant the org secrets and install the release-bot app on vrtx-flutter for full automation; until then, publish by re-pushing the tag manually: git push origin :refs/tags/v${VERSION} && git push origin v${VERSION}"
          git tag "v${VERSION}" "${GITHUB_SHA}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
