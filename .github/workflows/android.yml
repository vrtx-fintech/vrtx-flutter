name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # `example/lib/local_config.dart` is gitignored (it holds developer
      # credentials). Use the committed `.example.dart` template as a stub so
      # the example compiles in CI without exposing real secrets.
      - name: Stub local_config.dart
        run: cp lib/local_config.example.dart lib/local_config.dart
        working-directory: example

      # The example pulls the plugin via `path: ..`, so pub get must run in the
      # example dir for autolinking to wire up the Android module.
      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        working-directory: example/android

      - name: Build signed Android release APK
        run: flutter build apk --release
        working-directory: example
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}
