name: Android

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-example-app:
    runs-on: ubuntu-latest

    env:
      # Secrets are not readable in step `if:` conditions, so surface their
      # presence through the env context. Without the keystore secret (e.g. a
      # fork PR), the job degrades to a debug build instead of failing on
      # missing repository configuration.
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.7"
          cache: true

      # `example/lib/local_config.dart` is gitignored (it holds developer
      # credentials). Use the committed `.example.dart` template as a stub so
      # the example compiles in CI without exposing real secrets.
      - name: Stub local_config.dart
        run: cp lib/local_config.example.dart lib/local_config.dart
        working-directory: example

      # The example pulls the plugin via `path: ..`, so pub get must run in the
      # example dir for autolinking to wire up the Android module.
      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Build unsigned debug APK (signing secrets absent)
        if: env.ANDROID_SIGNING_CONFIGURED != 'true'
        run: |
          echo "::notice::ANDROID_KEYSTORE_BASE64 is not configured; building a debug APK. Configure the Android signing secrets to get signed release APKs from this job."
          flutter build apk --debug
        working-directory: example

      - name: Configure Android release signing
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        working-directory: example/android

      # Build per-ABI release APKs so each device gets only the native
      # libraries for its architecture instead of one universal APK carrying
      # arm64-v8a, armeabi-v7a, and x86_64 together.
      - name: Build signed Android release APKs
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        run: flutter build apk --release --split-per-abi
        working-directory: example
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_VRTX_CERT_HASH: ${{ secrets.VRTX_CERT_HASH }}

      # Like the iOS job's IPA: the signed build exists so it can be installed
      # on devices for app-integrity verification, so it has to leave the
      # runner.
      - name: Upload signed APK artifacts
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vrtx-flutter-example-signed-apks
          path: example/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 14
