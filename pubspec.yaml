name: vrtx_flutter
description: The official Flutter SDK for Vrtx — onboarding, wallet, and card flows for your app.
repository: https://github.com/vrtx-fintech/vrtx-flutter
issue_tracker: https://github.com/vrtx-fintech/vrtx-flutter/issues
homepage: https://vrtx.sa
topics:
  - sdk
  - fintech
  - wallet
  - onboarding

version: 0.1.2

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

flutter:
  plugin:
    platforms:
      android:
        package: sa.vrtx.flutter
        pluginClass: VrtxFlutterPlugin
      ios:
        pluginClass: VrtxFlutterPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned exactly, not ranged. very_good_analysis rewrites the `include:` line
  # in analysis_options.yaml to the resolved version on every `pub get`, so a
  # range leaves the tree dirty in CI as soon as a new version lands — which
  # fails `pub publish --dry-run` on "checked-in files are modified".
  # Bump this and the two `include:` lines together.
  very_good_analysis: 10.3.0
